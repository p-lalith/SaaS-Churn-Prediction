services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./rf_churn_pipeline.joblib:/app/rf_churn_pipeline.joblib:ro

  frontend:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
